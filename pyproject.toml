[project]
name = "model_deployment_operator"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10,<4.0"
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
  "kopf[uvloop]>=1.37.2,<2.0.0",
  "kubernetes>=29.0.0,<30.0.0",
  "fire>=0.6.0,<0.7.0",
  "tritonclient[http]>=2.45.0,<3.0.0",
  "boto3>=1.34.98,<2.0.0",
  "boto3-stubs[s3]>=1.34.98,<2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.1.1,<9.0.0",
  "testcontainers>=4.3.0,<5.0.0",
  "pytest-datadir>=1.5.0,<2.0.0",
  "triton-testcontainer @ git+https://github.com/ogvalt/triton-testcontainer.git@v0.5.0",
  "kubecrd @ git+https://github.com/ogvalt/kubecrd.git@v0.5.1",
  "pydantic>=2.7.1,<3.0.0",
  "jsonref>=1.1.0,<2.0.0",
  "pyyaml>=6.0.1,<7.0.0",
  "kubernetes-validate>=1.29.1,<2.0.0",
  "datamodel-code-generator>=0.25.6,<0.26.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "info"
pythonpath = [
  "."
]

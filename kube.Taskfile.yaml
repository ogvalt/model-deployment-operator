version: '3'

vars:
  OPERATOR_CHART_FOLDER: helm

tasks:

  develop:
    desc: Start development process
    cmds:
      - task: start-localstack
      - task: wait-localstack
      - task: start
      - task: load-images
      - task: install-triton
      - task: install-operator-chart
      - task: apply-s3-example

  stop-develop:
    desc: Stop development process
    cmds:
      - task: delete-s3-example
      - task: delete-operator-chart
      - task: delete-triton
      - task: stop
      - task: stop-localstack

  start-localstack:
    desc: Start localstack with seeded test bucket/object
    cmds:
      - docker compose up -d localstack

  wait-localstack:
    desc: Wait for localstack to become healthy
    cmds:
      - |
        TRIES=0
        # 60 tries * 2s sleep = ~120s total timeout.
        LOCALSTACK_HEALTH_MAX_TRIES=60
        until curl -sS http://localhost:4566/_localstack/health | grep -q '"s3": "available"'; do
          TRIES=$((TRIES + 1))
          if [ "$TRIES" -ge "$LOCALSTACK_HEALTH_MAX_TRIES" ]; then
            echo "LocalStack did not become healthy in time"
            exit 1
          fi
          sleep 2
        done

  stop-localstack:
    desc: Stop localstack
    cmds:
      - docker compose down
  start:
      desc: Start minikube
      cmds:
        - minikube start --kubernetes-version=v1.29.0

  load-images:
      desc: Load application to minikube
      cmds:
        - minikube image load popovych-labs/model-deployment-operator:latest-dev
        - minikube image load popovych-labs/model-deployment-operator/job/s3:latest-dev

  stop:
    desc: Stop minikube
    cmds:
      - minikube stop

  install-operator-chart:
    desc: Install helm chart
    cmds:
      - |
        helm upgrade --install \
        --values ./{{.OPERATOR_CHART_FOLDER}}/values.yaml \
        --namespace model-deployment-operator --create-namespace \
        model-deployment-operator ./{{.OPERATOR_CHART_FOLDER}} &> log.txt 

  render-operator-chart:
    desc: Render helm chart
    cmds:
      - |
        helm template triton ./{{.OPERATOR_CHART_FOLDER}} \
        -n model-deployment-operator \
        --values ./{{.OPERATOR_CHART_FOLDER}}/values.yaml 
        # --validate

  delete-operator-chart:
    desc: Render helm chart
    cmds:
      - |
        helm delete model-deployment-operator -n model-deployment-operator
      
  install-triton:
    desc: Install helm chart
    cmds:
      - |
        helm upgrade --install \
        --values ./testing/triton-chart/values.yaml \
        --values ./testing/triton-chart/triton-values.yaml \
        --namespace triton --create-namespace \
        triton ./testing/triton-chart

  render-triton-template:
    desc: Render helm chart
    cmds:
      - |
        helm template triton ./testing/triton-chart \
        -n triton \
        --values ./testing/triton-chart/values.yaml \
        --values ./testing/triton-chart/triton-values.yaml \
        --validate

  delete-triton:
    desc: Delete helm release
    cmds:
      - |
        helm delete triton -n triton

  apply-s3-example:
    desc: Apply local S3 auth config and example ModelDeployment
    cmds:
      - kubectl apply -f ./example/config-map-operator.yaml
      - kubectl apply -f ./example/md-source-s3.yaml

  delete-s3-example:
    desc: Delete local S3 auth config and example ModelDeployment
    cmds:
      - kubectl delete -f ./example/md-source-s3.yaml --ignore-not-found=true
      - kubectl delete -f ./example/config-map-operator.yaml --ignore-not-found=true
